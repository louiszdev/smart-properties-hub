<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Properties Hub — Nsukka, Enugu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #F5820A;
    --orange-glow: rgba(245,130,10,0.15);
    --dark: #070A14;
    --dark2: #0D1121;
    --dark3: #111827;
    --white: #F8F6F0;
    --white-dim: rgba(248,246,240,0.6);
    --navy: #0D1235;
  }

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--dark);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    overflow-x: hidden;
    cursor: none;
  }

  /* CUSTOM CURSOR */
  .cursor {
    width: 12px; height: 12px;
    background: var(--orange);
    border-radius: 50%;
    position: fixed; top:0; left:0;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%,-50%);
    transition: transform 0.1s, width 0.3s, height 0.3s, background 0.3s;
    mix-blend-mode: difference;
  }
  .cursor-ring {
    width: 40px; height: 40px;
    border: 1px solid rgba(245,130,10,0.5);
    border-radius: 50%;
    position: fixed; top:0; left:0;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%,-50%);
    transition: transform 0.15s ease-out, width 0.3s, height 0.3s;
  }
  body:hover .cursor { opacity:1; }

  /* NAV */
  nav {
    position: fixed; top:0; left:0; right:0;
    z-index: 100;
    padding: 20px 5%;
    display: flex; align-items:center; justify-content:space-between;
    transition: background 0.4s, backdrop-filter 0.4s;
  }
  nav.scrolled {
    background: rgba(7,10,20,0.9);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(245,130,10,0.1);
  }
  .nav-logo {
    display: flex; align-items:center; gap:12px;
    text-decoration: none;
  }
  .nav-logo-icon {
    width: 42px; height: 42px;
    background: var(--navy);
    border: 2px solid var(--orange);
    border-radius: 8px;
    display: flex; align-items:center; justify-content:center;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 14px;
    color: var(--white);
    position: relative;
  }
  .nav-logo-icon::after {
    content: '';
    position: absolute; bottom:-4px; right:-4px;
    width: 8px; height: 20px;
    background: var(--orange);
    border-radius: 2px;
  }
  .nav-logo-text {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--white);
  }
  .nav-logo-text span { color: var(--orange); }
  .nav-links { display:flex; gap:36px; list-style:none; }
  .nav-links a {
    font-size: 12px; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--white-dim); text-decoration:none;
    transition: color 0.3s;
    position: relative;
  }
  .nav-links a::after {
    content:''; position:absolute; bottom:-4px; left:0;
    width:0; height:1px; background:var(--orange);
    transition: width 0.3s;
  }
  .nav-links a:hover { color:var(--white); }
  .nav-links a:hover::after { width:100%; }
  .nav-cta {
    background: var(--orange);
    color: var(--dark) !important;
    padding: 10px 22px;
    border-radius: 4px;
    font-weight: 700 !important;
    font-size: 12px !important;
    text-decoration: none;
    letter-spacing: 0.1em;
    transition: transform 0.2s, box-shadow 0.2s !important;
  }
  .nav-cta:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(245,130,10,0.4); }
  .nav-cta::after { display:none !important; }

  /* HAMBURGER */
  .hamburger { display:none; flex-direction:column; gap:5px; cursor:pointer; padding:4px; }
  .hamburger span { width:24px; height:2px; background:var(--white); border-radius:2px; transition:0.3s; }

  /* HERO */
  .hero {
    min-height: 100vh;
    position: relative;
    display: flex; align-items:center;
    overflow: hidden;
    padding: 120px 5% 80px;
  }
  .hero-bg {
    position: absolute; inset:0;
    background: linear-gradient(135deg, #050810 0%, #0D1235 50%, #0A0D1A 100%);
  }
  .hero-grid {
    position: absolute; inset:0;
    background-image:
      linear-gradient(rgba(245,130,10,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(245,130,10,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: gridMove 20s linear infinite;
  }
  @keyframes gridMove { from{background-position:0 0;} to{background-position:60px 60px;} }

  .hero-orb1 {
    position: absolute; top:-200px; right:-100px;
    width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(245,130,10,0.12) 0%, transparent 70%);
    border-radius: 50%;
    animation: orbPulse 6s ease-in-out infinite;
  }
  .hero-orb2 {
    position: absolute; bottom:-300px; left:-150px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(13,18,53,0.8) 0%, transparent 70%);
    border-radius: 50%;
  }
  @keyframes orbPulse { 0%,100%{transform:scale(1);opacity:1;} 50%{transform:scale(1.1);opacity:0.7;} }

  .hero-content { position:relative; z-index:2; max-width:780px; }
  .hero-badge {
    display: inline-flex; align-items:center; gap:8px;
    background: rgba(245,130,10,0.1);
    border: 1px solid rgba(245,130,10,0.3);
    border-radius: 100px;
    padding: 6px 16px;
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.15em; text-transform:uppercase;
    color: var(--orange);
    margin-bottom: 28px;
    opacity:0; transform:translateY(20px);
    animation: fadeUp 0.8s 0.2s forwards;
  }
  .hero-badge-dot { width:6px; height:6px; background:var(--orange); border-radius:50%; animation:blink 2s infinite; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(52px, 8vw, 96px);
    font-weight: 300;
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin-bottom: 28px;
    opacity:0; transform:translateY(30px);
    animation: fadeUp 0.9s 0.4s forwards;
  }
  .hero-title em { font-style:italic; color: var(--orange); }
  .hero-title strong { font-weight: 700; display:block; }

  .hero-sub {
    font-size: 16px; line-height: 1.7;
    color: var(--white-dim); max-width: 520px;
    margin-bottom: 48px;
    opacity:0; transform:translateY(20px);
    animation: fadeUp 0.8s 0.6s forwards;
  }

  .hero-actions {
    display:flex; gap:16px; flex-wrap:wrap;
    opacity:0; transform:translateY(20px);
    animation: fadeUp 0.8s 0.8s forwards;
  }
  .btn-primary {
    display: inline-flex; align-items:center; gap:10px;
    background: var(--orange);
    color: var(--dark);
    padding: 16px 32px;
    border-radius: 4px;
    font-family: 'Syne', sans-serif;
    font-weight: 700; font-size: 13px;
    letter-spacing: 0.08em; text-transform:uppercase;
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
    position: relative; overflow:hidden;
  }
  .btn-primary::before {
    content:''; position:absolute; inset:0;
    background: rgba(255,255,255,0.15);
    transform: translateX(-100%) skewX(-10deg);
    transition: transform 0.4s;
  }
  .btn-primary:hover::before { transform: translateX(100%) skewX(-10deg); }
  .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 16px 40px rgba(245,130,10,0.5); }

  .btn-secondary {
    display: inline-flex; align-items:center; gap:10px;
    border: 1px solid rgba(248,246,240,0.2);
    color: var(--white);
    padding: 16px 32px;
    border-radius: 4px;
    font-family: 'Syne', sans-serif;
    font-weight: 600; font-size: 13px;
    letter-spacing: 0.08em; text-transform:uppercase;
    text-decoration: none;
    transition: border-color 0.3s, background 0.3s;
    backdrop-filter: blur(10px);
  }
  .btn-secondary:hover { border-color: var(--orange); background: var(--orange-glow); }

  .hero-stats {
    position: absolute; bottom: 60px; right: 5%;
    display: flex; gap: 48px;
    opacity:0; animation: fadeUp 0.8s 1s forwards;
  }
  .stat { text-align:right; }
  .stat-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 42px; font-weight: 700;
    color: var(--orange); line-height:1;
  }
  .stat-label {
    font-size: 11px; letter-spacing:0.12em;
    text-transform:uppercase; color: var(--white-dim);
    margin-top: 4px;
  }

  .scroll-indicator {
    position: absolute; bottom: 40px; left: 5%;
    display: flex; align-items:center; gap:12px;
    opacity:0; animation: fadeUp 0.8s 1.2s forwards;
  }
  .scroll-line {
    width: 40px; height: 1px;
    background: linear-gradient(90deg, var(--orange), transparent);
  }
  .scroll-text { font-size: 10px; letter-spacing:0.2em; text-transform:uppercase; color:var(--white-dim); }

  @keyframes fadeUp {
    to { opacity:1; transform:translateY(0); }
  }

  /* SECTION BASE */
  section { padding: 100px 5%; }
  .section-label {
    font-size: 11px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--orange);
    margin-bottom: 16px;
    display: flex; align-items:center; gap:12px;
  }
  .section-label::before {
    content:''; width:30px; height:1px; background:var(--orange);
  }
  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(36px, 5vw, 64px);
    font-weight: 300; line-height: 1.1;
    margin-bottom: 20px;
  }
  .section-title em { font-style:italic; color:var(--orange); }

  /* ABOUT */
  .about { background: var(--dark2); }
  .about-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 80px; align-items:center;
    margin-top: 60px;
  }
  .about-visual {
    position: relative; border-radius: 8px; overflow: hidden;
  }
  .about-img-container {
    width:100%; aspect-ratio: 4/5;
    background: linear-gradient(135deg, #0D1235, #1a2050);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    border: 1px solid rgba(245,130,10,0.15);
  }
  .about-img-container img {
    width:100%; height:100%; object-fit:cover;
    opacity: 0.85;
  }
  .about-tag {
    position: absolute; bottom: 24px; left: 24px;
    background: rgba(7,10,20,0.9);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(245,130,10,0.3);
    border-radius: 6px; padding: 14px 20px;
  }
  .about-tag-name {
    font-family: 'Syne', sans-serif;
    font-weight: 700; font-size: 14px;
  }
  .about-tag-role { font-size: 11px; color: var(--orange); margin-top: 3px; }

  .about-corner {
    position: absolute; top:-20px; right:-20px;
    width: 120px; height: 120px;
    border: 2px solid rgba(245,130,10,0.2);
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    background: var(--dark2);
  }
  .about-corner-inner {
    width: 80px; height: 80px;
    background: var(--orange);
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Syne',sans-serif; font-weight:800; font-size:20px;
    color: var(--dark);
  }

  .about-text p {
    color: var(--white-dim); line-height: 1.8;
    font-size: 15px; margin-bottom: 20px;
  }
  .about-features { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top: 36px; }
  .feature-item {
    background: rgba(245,130,10,0.05);
    border: 1px solid rgba(245,130,10,0.1);
    border-radius: 8px; padding: 20px;
    transition: border-color 0.3s, background 0.3s;
  }
  .feature-item:hover { border-color: rgba(245,130,10,0.4); background: rgba(245,130,10,0.08); }
  .feature-icon { font-size: 24px; margin-bottom: 10px; }
  .feature-title { font-family:'Syne',sans-serif; font-weight:700; font-size:13px; margin-bottom:6px; }
  .feature-desc { font-size:12px; color:var(--white-dim); line-height:1.5; }

  /* HOW IT WORKS */
  .how { background: var(--dark); }
  .steps { display:grid; grid-template-columns: repeat(3, 1fr); gap:2px; margin-top:60px; }
  .step {
    background: var(--dark3);
    padding: 48px 36px;
    position:relative; overflow:hidden;
    transition: background 0.3s;
  }
  .step:hover { background: rgba(13,18,53,0.8); }
  .step::after {
    content:''; position:absolute; top:0; left:0; right:0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--orange), transparent);
    transform: scaleX(0);
    transition: transform 0.4s;
  }
  .step:hover::after { transform: scaleX(1); }
  .step-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 80px; font-weight: 700;
    color: rgba(245,130,10,0.08);
    position:absolute; top:-10px; right:20px;
    line-height:1;
  }
  .step-icon { font-size: 32px; margin-bottom: 20px; }
  .step-title {
    font-family:'Syne',sans-serif; font-weight:700;
    font-size: 18px; margin-bottom:12px;
  }
  .step-desc { font-size:14px; color:var(--white-dim); line-height:1.7; }

  /* PRODUCTS */
  .products { background: var(--dark2); }
  .products-header {
    display:flex; justify-content:space-between; align-items:flex-end;
    margin-bottom: 50px; flex-wrap:wrap; gap:20px;
  }
  .filter-tabs { display:flex; gap:8px; flex-wrap:wrap; }
  .filter-tab {
    padding: 8px 18px;
    border: 1px solid rgba(248,246,240,0.15);
    border-radius: 100px;
    font-size: 12px; letter-spacing:0.08em; text-transform:uppercase;
    color: var(--white-dim);
    cursor:pointer; transition:all 0.3s;
    background:transparent;
    font-family:'DM Sans',sans-serif;
  }
  .filter-tab.active, .filter-tab:hover {
    background: var(--orange); color: var(--dark);
    border-color: var(--orange); font-weight:700;
  }

  .products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 24px;
  }
  .product-card {
    background: var(--dark3);
    border: 1px solid rgba(248,246,240,0.06);
    border-radius: 12px; overflow:hidden;
    transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
    position:relative;
  }
  .product-card:hover {
    transform: translateY(-8px);
    border-color: rgba(245,130,10,0.3);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .product-img {
    width:100%; height: 220px; object-fit:cover;
    display:block;
    transition: transform 0.5s;
    background: #1a1a2e;
  }
  .product-card:hover .product-img { transform:scale(1.05); }
  .product-badge {
    position:absolute; top:16px; left:16px;
    background: var(--orange);
    color: var(--dark);
    font-family:'Syne',sans-serif; font-weight:800;
    font-size: 10px; letter-spacing:0.1em;
    padding: 4px 10px; border-radius: 4px;
  }
  .product-info { padding: 24px; }
  .product-category {
    font-size:10px; letter-spacing:0.15em; text-transform:uppercase;
    color: var(--orange); margin-bottom:8px;
  }
  .product-name {
    font-family:'Syne',sans-serif; font-weight:700;
    font-size: 16px; margin-bottom:8px;
  }
  .product-desc { font-size:13px; color:var(--white-dim); line-height:1.6; margin-bottom:20px; }
  .product-footer { display:flex; align-items:center; justify-content:space-between; }
  .product-price {
    font-family:'Cormorant Garamond',serif;
    font-size: 26px; font-weight:700; color: var(--orange);
  }
  .product-price small { font-size:14px; font-weight:300; color:var(--white-dim); }
  .product-wa {
    display:inline-flex; align-items:center; gap:8px;
    background: #25D366;
    color: white; padding: 10px 18px;
    border-radius: 6px; text-decoration:none;
    font-family:'Syne',sans-serif; font-weight:700; font-size:12px;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .product-wa:hover { transform:translateY(-2px); box-shadow: 0 8px 20px rgba(37,211,102,0.4); }
  .wa-icon { width:16px; height:16px; }

  /* PROPERTIES */
  .properties { background: var(--dark); }
  .props-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(340px,1fr)); gap:24px; margin-top:50px; }
  .prop-card {
    background: var(--dark3);
    border-radius: 12px; overflow:hidden;
    border: 1px solid rgba(248,246,240,0.06);
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .prop-card:hover { transform:translateY(-6px); box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .prop-img-wrap { position:relative; height:240px; overflow:hidden; }
  .prop-img {
    width:100%; height:100%; object-fit:cover;
    transition:transform 0.5s;
    background: #0d1235;
  }
  .prop-card:hover .prop-img { transform:scale(1.08); }
  .prop-overlay {
    position:absolute; inset:0;
    background: linear-gradient(to top, rgba(7,10,20,0.9) 0%, transparent 60%);
  }
  .prop-type {
    position:absolute; top:16px; right:16px;
    background: var(--orange); color:var(--dark);
    font-family:'Syne',sans-serif; font-weight:800;
    font-size:11px; padding:5px 12px; border-radius:4px;
  }
  .prop-info { padding:24px; }
  .prop-name { font-family:'Syne',sans-serif; font-weight:700; font-size:18px; margin-bottom:8px; }
  .prop-location { font-size:13px; color:var(--white-dim); margin-bottom:16px; display:flex; align-items:center; gap:6px; }
  .prop-specs { display:flex; gap:20px; margin-bottom:20px; }
  .prop-spec { font-size:12px; color:var(--white-dim); }
  .prop-spec strong { color:var(--white); font-weight:600; }
  .prop-footer { display:flex; align-items:center; justify-content:space-between; }
  .prop-price { font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:700; color:var(--orange); }

  /* TESTIMONIALS */
  .testimonials { background: var(--dark2); }
  .testi-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:20px; margin-top:50px; }
  .testi-card {
    background: var(--dark3);
    border:1px solid rgba(248,246,240,0.06);
    border-radius:12px; padding:30px;
    transition:border-color 0.3s;
    position:relative;
  }
  .testi-card:hover { border-color:rgba(245,130,10,0.2); }
  .testi-quote {
    font-family:'Cormorant Garamond',serif;
    font-size:60px; line-height:1;
    color: rgba(245,130,10,0.2);
    position:absolute; top:16px; right:20px;
  }
  .testi-stars { color:var(--orange); font-size:14px; margin-bottom:16px; }
  .testi-text { font-size:14px; color:var(--white-dim); line-height:1.8; margin-bottom:20px; font-style:italic; }
  .testi-author { font-family:'Syne',sans-serif; font-weight:700; font-size:14px; }
  .testi-role { font-size:12px; color:var(--orange); margin-top:3px; }

  /* CTA BANNER */
  .cta-banner {
    background: var(--dark);
    padding: 80px 5%;
    text-align:center;
    position:relative; overflow:hidden;
  }
  .cta-banner::before {
    content:''; position:absolute; inset:0;
    background: radial-gradient(ellipse at center, rgba(245,130,10,0.08) 0%, transparent 70%);
  }
  .cta-banner-content { position:relative; z-index:2; }
  .cta-banner h2 {
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(36px,5vw,64px); font-weight:300;
    margin-bottom:16px;
  }
  .cta-banner p { color:var(--white-dim); font-size:16px; max-width:500px; margin:0 auto 36px; line-height:1.7; }
  .cta-actions { display:flex; justify-content:center; gap:16px; flex-wrap:wrap; }

  /* FOOTER */
  footer {
    background: var(--dark2);
    border-top: 1px solid rgba(248,246,240,0.05);
    padding: 60px 5% 30px;
  }
  .footer-grid { display:grid; grid-template-columns:2fr 1fr 1fr; gap:60px; margin-bottom:48px; }
  .footer-brand { }
  .footer-logo {
    font-family:'Syne',sans-serif; font-weight:800;
    font-size:20px; margin-bottom:16px;
  }
  .footer-logo span { color:var(--orange); }
  .footer-tagline { font-size:14px; color:var(--white-dim); line-height:1.7; max-width:280px; }
  .footer-contacts { margin-top:24px; display:flex; flex-direction:column; gap:10px; }
  .footer-contact { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--white-dim); }
  .contact-icon { font-size:16px; }
  .footer-col h4 { font-family:'Syne',sans-serif; font-weight:700; font-size:13px; letter-spacing:0.1em; text-transform
